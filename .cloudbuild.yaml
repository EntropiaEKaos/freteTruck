steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/fretetruck:$SHORT_SHA",
        "-f",
        "Dockerfile",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/fretetruck:$SHORT_SHA"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "fretetruck",
        "--image",
        "gcr.io/$PROJECT_ID/fretetruck:$SHORT_SHA",
        "--region",
        "southamerica-east1",
        "--platform",
        "managed",
        "--port",
        "3000",
        "--allow-unauthenticated",
      ]
images:
  - "gcr.io/$PROJECT_ID/fretetruck:$SHORT_SHA"
