# Nginx config for FreteTruck — reverse proxy with SSL
upstream fretetruck {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name www.fretetruck.app fretetruck.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.fretetruck.app fretetruck.app;

    ssl_certificate     /etc/letsencrypt/live/fretetruck.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fretetruck.app/privkey.pem;

    location / {
        proxy_pass http://fretetruck;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # For file uploads (future)
        client_max_body_size 10M;
    }

    # API rate limits
    limit_req_zone=api_zone binary_addr_rate=30r/s;
    location /api/ {
        proxy_pass http://fretetruck;
        limit_req zone=api_zone burst=50 nodelay;
    }
}
